name: "🏡 부동산 모니터 (자동 스캔)"
on:
  schedule:
    - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '특정 지역만'
        required: false
        default: ''
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: 🔬 직방 v3 파라미터 탐색
        run: |
          python3 - << 'PYEOF' | tee api_test.txt
          import requests, json, time
          B = "https://apis.zigbang.com/v3/items"
          H = {"User-Agent":"Mozilla/5.0","Referer":"https://www.zigbang.com/","Accept":"application/json"}
          tests = [
            ("v3 기본(wydm)",         {"domain":"zigbang","geohash":"wydm"}),
            ("v3 기본(wyd)",          {"domain":"zigbang","geohash":"wyd"}),
            ("v3 원룸",               {"domain":"zigbang","geohash":"wydm","service_type_eq":"원룸"}),
            ("v3 아파트",             {"domain":"zigbang","geohash":"wydm","service_type_eq":"아파트"}),
            ("v3 빌라",               {"domain":"zigbang","geohash":"wydm","service_type_eq":"빌라"}),
            ("v3 전세",               {"domain":"zigbang","geohash":"wydm","sales_type_in":"전세"}),
            ("v3 전세+원룸",          {"domain":"zigbang","geohash":"wydm","sales_type_in":"전세","service_type_eq":"원룸"}),
            ("v3 원룸 서울좌표",      {"domain":"zigbang","lat":37.5665,"lng":126.978,"zoom":13,"service_type_eq":"원룸","sales_type_in":"전세"}),
            ("v3 no-domain",          {"geohash":"wydm","service_type_eq":"원룸"}),
            ("v2 원룸 zoom없음",      None),  # v2 no zoom
          ]
          for name, params in tests:
            try:
              url = B if params is not None else "https://apis.zigbang.com/v2/items"
              if params is None:
                params = {"domain":"zigbang","geohash":"wydm","needHasNoFiltered":"true","sales_type_in":"전세","service_type_eq":"원룸"}
              r = requests.get(url, params=params, headers=H, timeout=8)
              body = r.text[:200]
              cnt = 0
              try:
                j = r.json()
                cnt = len(j.get("items", j.get("clusters",[])))
              except:
                pass
              print(f"[{r.status_code}|{cnt}건] {name}")
              if r.status_code == 200 and cnt > 0:
                j = r.json()
                items = j.get("items", [])
                if items:
                  print(f"  샘플 키: {list(items[0].keys())[:8]}")
                  print(f"  샘플: {items[0]}")
            except Exception as e:
              print(f"[ERR] {name}: {str(e)[:80]}")
            time.sleep(0.3)
          PYEOF
      - name: 💾 결과 저장
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "Actions"
          git add api_test.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "log: v3 test [skip ci]"
          git push || true
