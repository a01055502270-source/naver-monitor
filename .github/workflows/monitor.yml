name: "🏡 부동산 모니터 (자동 스캔)"
on:
  schedule:
    - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '특정 지역만'
        required: false
        default: ''
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: 🔬 진단
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python diagnose.py > diagnostic.txt 2>&1
          python main.py --region "${{ github.event.inputs.region }}" >> diagnostic.txt 2>&1 || true
          git config user.email "actions@github.com"
          git config user.name "Actions"
          git add diagnostic.txt
          git diff --staged --quiet || git commit -m "debug: diagnostic [skip ci]"
          git push || true
