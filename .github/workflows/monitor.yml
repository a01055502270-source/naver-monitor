name: "🏡 부동산 모니터 (자동 스캔)"
on:
  schedule:
    - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '특정 지역만'
        required: false
        default: ''
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: 🔬 v3 심층 테스트
        run: |
          python3 - << 'PYEOF' | tee api_test.txt
          import requests, json, time
          H = {
            "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15",
            "Referer": "https://www.zigbang.com/",
            "Accept": "application/json, text/plain, */*",
            "Accept-Language": "ko-KR,ko;q=0.9",
            "Origin": "https://www.zigbang.com",
          }
          BASE = "https://apis.zigbang.com"

          tests = [
            # v3 POST 시도
            ("v3 POST",        "POST", f"{BASE}/v3/items",
             {"domain":"zigbang","geohash":"wydm","service_type_eq":"원룸"}, None),
            # oneroomCode 기반 엔드포인트
            ("v3 oneroomcode", "GET",  f"{BASE}/v3/items/list-by-oneroomcode",
             {"domain":"zigbang","oneroomCodes[]":"wydm","checkAnyItemWithoutFilters":"true"}, None),
            # 더 짧은 geohash
            ("v3 geohash=wy",  "GET",  f"{BASE}/v3/items",
             {"domain":"zigbang","geohash":"wy","service_type_eq":"원룸"}, None),
            # v3 with needHasNoFiltered
            ("v3+filtered",    "GET",  f"{BASE}/v3/items",
             {"domain":"zigbang","geohash":"wydm","service_type_eq":"원룸","needHasNoFiltered":"true"}, None),
            # 직방 내부 API 시도
            ("직방 search",    "GET",  f"{BASE}/v2/search",
             {"leaseYn":"N","q":"하남시","serviceType":"원룸"}, None),
            # 직방 복합단지 조회
            ("직방 complexes", "GET",  f"{BASE}/v2/complexes/markers",
             {"domain":"zigbang","geohash":"wydm"}, None),
            # v2 원룸 최신 geohash 방식
            ("v2 원룸 세분화",  "GET",  f"{BASE}/v2/items",
             {"domain":"zigbang","zoom":"14","sales_type_in":"전세","geohash":"wydm",
              "service_type_eq":"원룸","deposit_gteq":"0","rent_gteq":"0"}, None),
          ]

          for name, method, url, params, body in tests:
            try:
              if method == "POST":
                r = requests.post(url, json=params, headers=H, timeout=8)
              else:
                r = requests.get(url, params=params, headers=H, timeout=8)
              cnt = 0
              sample = ""
              try:
                j = r.json()
                for key in ("items","clusters","complexes","result","data"):
                  if key in j and isinstance(j[key], list):
                    cnt = len(j[key])
                    if cnt > 0:
                      sample = f" | 샘플키: {list(j[key][0].keys())[:6]}"
                    break
              except: pass
              print(f"[{r.status_code}|{cnt}건] {name}{sample}")
              if cnt > 0:
                j = r.json()
                for key in ("items","clusters","complexes","result","data"):
                  if key in j and j[key]:
                    print(f"  → {j[key][0]}")
                    break
            except Exception as e:
              print(f"[ERR] {name}: {str(e)[:100]}")
            time.sleep(0.3)
          PYEOF
      - name: 💾 결과 저장
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "Actions"
          git add api_test.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "log: v3 deep test [skip ci]"
          git push || true
