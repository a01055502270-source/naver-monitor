name: 🏡 부동산 모니터 (자동 스캔)

on:
  schedule:
    - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '특정 지역만 실행 (비우면 전체)'
        required: false
        default: ''

jobs:
  monitor:
    name: 매물 스캔
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 🧪 직방 API 연결 확인
        run: |
          python3 -c "
          import requests, json
          r = requests.get(
            'https://apis.zigbang.com/v2/items',
            params={'deposit_gteq':0,'domain':'zigbang','geohash':'wydm7',
                    'needHasNoFiltered':'true','rent_gteq':0,
                    'sales_type_in':'전세|월세','service_type_eq':'아파트'},
            timeout=15)
          items = r.json().get('items', [])
          print(f'직방 API 상태: HTTP {r.status_code}')
          print(f'수신 매물 수: {len(items)}건')
          if items:
              print(f'샘플 키: {list(items[0].keys())}')
              print(f'샘플 값: {items[0]}')
          "

      - name: 🔍 매물 스캔
        env:
          SUPABASE_URL:         \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: \${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     \${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "\${{ github.event.inputs.region }}" ]; then
            python main.py --region "\${{ github.event.inputs.region }}"
          else
            python main.py
          fi

      - name: 📋 로그 저장 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-\${{ github.run_id }}
          path: monitor.log
          retention-days: 7
